<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Marquee Directions</title>
    <style>
        .marquee-box {
            margin: 15px 0;
            padding: 10px;
            background-color: #f4f4f4;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>
    <!-- 1. Left Marquee -->
    <div class="marquee-box">
        <marquee direction="left" scrollamount="6">
            <p>This is the first paragraph scrolling from right to <b>LEFT</b>.</p>
        </marquee>
    </div>

    <!-- 2. Right Marquee -->
    <div class="marquee-box">
        <marquee direction="right" scrollamount="6">
            <p>This is the second paragraph scrolling from left to <b>RIGHT</b>.</p>
        </marquee>
    </div>

    <!-- 3. Down Marquee -->
    <div class="marquee-box">
        <marquee direction="down" height="120px" scrollamount="4">
            <p>This is the third paragraph scrolling <b>DOWNWARDS</b>.</p>
        </marquee>
    </div>
</body>

</html>
