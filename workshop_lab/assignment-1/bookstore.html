<!DOCTYPE html>
<html lang="en">

<head>
    
    <title>Online Bookstore</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;

        }

        
        table.frame-container {
            width: 100%;
            height: 100%;   
            border-collapse: collapse;
            border: 2px solid #000000;
        }

        
        table.frame-container td,
        table.frame-container th {
            border: 1px solid #000000;
            padding: 8px;
            vertical-align: top;
        }

       
        .header-cell {
            background-color: #bd8253;
           
            color: #000000;
            font-weight: bold;
            text-align: center;
        }

        .logo-box {
            width: 20%;
            font-size: 16px;
        }

        .title-box {
            font-size: 20px;
        }


        .nav-cell {
            text-align: center;
            background-color: #ebc37e;
            padding: 8px 0;
            width: 20%;
        }

        .nav-cell a {
            color: #000000;
            text-decoration: none;
            font-weight: bold;
            display: block;
            width: 100%;
        }
        
        .left-menu {
            width: 20%;
            background-color: #fafafa;
        }

        .left-menu a {
            display: block;
            color: #000000;
            font-weight: bold;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>
   

    <table align="center" class="frame-container">
        

       
        <tr>
            <td class="header-cell logo-box">Logo</td>
            <td class="header-cell title-box" colspan="4">Web Site Name</td>
        </tr>
        <!-- Top Navigation Bar -->
        <tr>
            
            <td class="nav-cell"><a href="home.html" target="contentFrame">Home</a></td>
            <td class="nav-cell"><a href="login.html" target="contentFrame">Login</a></td>

            <td class="nav-cell"><a href="cart.html" target="contentFrame">Cart</a></td>
        </tr>

        
        <tr>
            
            <td class="left-menu">
                <a href="#cse">CSE</a>
                <a href="#ece">ECE</a>
                <a href="#eee">EEE</a>
                <a href="#civil">CIVIL</a>
            </td>

            <td colspan="4" align="center">

        </tr>
