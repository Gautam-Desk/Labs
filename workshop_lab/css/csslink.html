<!DOCTYPE html>
<html>
    <head>
        <title>CSS Links Example</title>

        <style>
            a{
                font-size: 24px;
                text-decoration: none;
            }
            a:link{
                color: blue;
            }
            a:visited{
                color: rgb(31, 241, 7);
            }
            a:hover{
                color: rgb(51, 0, 255);
                text-decoration: underline;
            }
            a:active{
                color: brown;
            }

        </style>
    </head>

    <body>
        <h2>CSS link styling</h2>
        <a href="google.com">Google</a>
        
    </body>
</html>
