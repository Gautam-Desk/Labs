<!DOCTYPE html>
<html>

<head>
    <title>CSS text properties</title>
    <style>
        h1 {
            color: navy;
            text-align: center;
            text-decoration: underline;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            color: darkgreen;
            text-align: justify;
            text-indent: 40px;
            word-spacing: 5px;
            line-height: 1.6;
        }

        h2 {
            text-align: right;
            text-shadow: 2px 2px 3px gray;
        }
    </style>
</head>

<body>
    <h1>web designing workshop</h1>
    <p>
        my name is G
    </p>
    <h2>learn CSS with practice</h2>
</body>

</html>
