<!DOCTYPE html>
<html>

<head>
    <title>CSS Margin and Padding</title>

    <style>
        .box1 {
            background-color: lightblue;
            border: 3px solid blue;

            margin: 40px;
            padding: 20px;

        }

        .box2 {
            background-color: lightyellow;
            border: 3px solid orange;
            margin: 20px;
            padding: 40px;
        }
    </style>
    
</head>

<body>
    <h1>CSS margin and padding</h1>
    <div class="box1">
        This is box 1.
        margin = 40px and padding =20px
    </div>
    <div class="box2">
        This is box 2.
        margin = 20px and padding =40px
    </div>

     <title>CSS Text property</title>
    <style>
        h1 {
            color: navy;
            text-align: center;
            text-decoration: underline;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p{
            color: aquamarine;
            text-align: justify;
            text-indent: 40px;
            word-spacing: 4px;
            line-height: 1.6;

        }

        h2{
            text-align: right;
            text-shadow: 2px 2px 3px gray;
        }
    </style>

</head>    

</body>

</html>
