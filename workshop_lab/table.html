<!DOCTYPE html>
<html>

<head>
    <title> My first table.</title>
    <style>
        table,
        th,
        td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        
    </style>


</head>

<body>

        </tr>

            <td> Singh </td>
            <td> 21 </td>
            <td> UP </td>
            <td> O+ </td>
        </tr>
        <tr>
            <td> Sharma </td>
            <td> 22 </td>
            <td> Delhi </td>
            <td> A+ </td>

        </tr>
        <tr>
            <td> Verma </td>
            <td> 23 </td>
            <td> MP </td>
            <td> B+ </td>
        </tr>
    </table>

</body>


</html>
