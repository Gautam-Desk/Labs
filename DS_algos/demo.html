<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Number Guessing Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at top left, #243b55, transparent 40%),
                radial-gradient(circle at bottom right, #141e30, #05070d);
            color: white;
        }

        .dashboard {
            width: 90%;
            max-width: 950px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 38px;
            margin-bottom: 8px;
        }

        .header p {
            color: #b7c1d6;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            padding: 22px;
            border-radius: 18px;
            text-align: center;
        }

        .card h3 {
            font-size: 14px;
            color: #aab5ca;
            margin-bottom: 10px;
        }

        .card span {
            font-size: 30px;
            font-weight: bold;
        }

        .game-area {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 25px;
        }

        .game-card,
        .history-card {
            background: rgba(255, 255, 255, 0.07);
            border-radius: 20px;
            padding: 25px;
        }

        .game-card h2,
        .history-card h2 {
            margin-bottom: 20px;
        }

        .number-box {
            text-align: center;
            font-size: 70px;
            font-weight: bold;
            margin: 25px 0;
        }

        .hint {
            text-align: center;
            min-height: 30px;
            color: #ffd166;
            font-weight: bold;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: none;
            outline: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            font-size: 18px;
            text-align: center;
            margin-bottom: 15px;
        }

        input::placeholder {
            color: #9da7bb;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 17px;
            font-weight: bold;
            background: #4f8cff;
            color: white;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .reset {
            margin-top: 12px;
            background: rgba(255, 255, 255, 0.12);
        }

        .history {
            max-height: 270px;
            overflow-y: auto;
        }

        .guess {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.07);
        }

        .correct {
            background: rgba(46, 204, 113, 0.25);
        }

        .game-over {
            color: #2ecc71;
        }

        @media (max-width: 700px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .game-area {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <div class="header">
            <h1>🎯 Number Guessing Game</h1>
            <p>Guess the hidden number between 1 and 100</p>
        </div>

        <div class="stats">

            <div class="card">
                <h3>ATTEMPTS</h3>
                <span id="attempts">0</span>
            </div>

            <div class="card">
                <h3>RANGE</h3>
                <span>1–100</span>
            </div>

            <div class="card">
                <h3>STATUS</h3>
                <span id="status">Playing</span>
            </div>

        </div>

        <div class="game-area">

            <div class="game-card">

                <h2>Make Your Guess</h2>

                <div class="number-box">?</div>

                <div class="hint" id="hint">
                    Start guessing!
                </div>

                <input type="number" id="guessInput" min="1" max="100" placeholder="Enter number 1–100">

                <button onclick="checkGuess()">
                    🎯 Submit Guess
                </button>

                <button class="reset" onclick="newGame()">
                    🔄 New Game
                </button>

            </div>

            <div class="history-card">

                <h2>📊 Guess History</h2>

                <div class="history" id="history">
                    <p style="color:#9da7bb;">
                        Your guesses will appear here...
                    </p>
                </div>

            </div>

        </div>

    </div>

    <script>

        let randomNumber;
        let attempts = 0;

        function newGame() {

            randomNumber = Math.floor(Math.random() * 100) + 1;

            attempts = 0;

            document.getElementById("attempts").textContent = attempts;
            document.getElementById("status").textContent = "Playing";
            document.getElementById("hint").textContent = "Start guessing!";
            document.getElementById("history").innerHTML =
                '<p style="color:#9da7bb;">Your guesses will appear here...</p>';

            document.getElementById("guessInput").value = "";

            console.log("New number generated:", randomNumber);
        }


        function checkGuess() {

            const input = document.getElementById("guessInput");

            const guessedNumber = Number(input.value);

            if (!guessedNumber || guessedNumber < 1 || guessedNumber > 100) {

                document.getElementById("hint").textContent =
                    "⚠️ Enter a number between 1 and 100.";

                return;
            }

            attempts++;

            document.getElementById("attempts").textContent = attempts;

            let history = document.getElementById("history");

            if (attempts === 1) {
                history.innerHTML = "";
            }

            let guessElement = document.createElement("div");

            guessElement.className = "guess";

            if (guessedNumber > randomNumber) {

                document.getElementById("hint").textContent =
                    "⬇️ Lower number please!";

                guessElement.innerHTML =
                    `<span>Guess ${attempts}</span>
                 <span>${guessedNumber} ↓</span>`;

            }

            else if (guessedNumber < randomNumber) {

                document.getElementById("hint").textContent =
                    "⬆️ Higher number please!";

                guessElement.innerHTML =
                    `<span>Guess ${attempts}</span>
                 <span>${guessedNumber} ↑</span>`;

            }

            else {

                document.getElementById("hint").textContent =
                    "🎉 Congrats! You guessed it!";

                document.getElementById("status").textContent =
                    "Won";

                document.getElementById("status").classList.add("game-over");

                guessElement.className = "guess correct";

                guessElement.innerHTML =
                    `<span>Guess ${attempts}</span>
                 <span>${guessedNumber} ✓</span>`;

            }

            history.prepend(guessElement);

            input.value = "";
            input.focus();
        }


        document.getElementById("guessInput")
            .addEventListener("keypress", function (event) {

                if (event.key === "Enter") {
                    checkGuess();
                }

            });


        newGame();

    </script>

</body>

</html>
